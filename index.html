    <!-- Preload critical images for instant loading -->

    <!-- Preload dock and card background images for navigation -->

    <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Qwitcher+Grypen:wght@400;700&display=swap" rel="stylesheet" />

    <!-- Inline script to set theme color immediately -->
    <script>
        (function () {
            const savedTheme = localStorage.getItem("theme");
            const isDark =
                savedTheme === "dark" ||
                (!savedTheme &&
                    window.matchMedia("(prefers-color-scheme: dark)").matches);
            const color = isDark ? "#000000" : "#ffffff";

            // Update theme-color immediately
            document
                .querySelector('meta[name="theme-color"]')
                .setAttribute("content", color);

            // Update status bar style
            const statusBar = document.querySelector(
                'meta[name="apple-mobile-web-app-status-bar-style"]'
            );
            if (statusBar) {
                statusBar.setAttribute(
                    "content",
                    isDark ? "black-translucent" : "default"
                );
            }

            // Set initial theme class
            document.documentElement.className = isDark ? "dark" : "light";
        })();
    </script>
</head>

<body>
